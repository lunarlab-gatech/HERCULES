name: ROS 2

# Builds the ROS 2 workspace on Jazzy and runs its tests: the URDF importer,
# and the Hero bridges end to end against a fake simulator. The importer is
# also tested on its own, without ROS, on Linux and on Windows (where the
# Unreal editor often runs).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ros2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  urdf-import:
    name: URDF importer, no ROS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml
      - name: Test
        working-directory: ros2/src/hercules_urdf_import
        run: python -m pytest -q test

  jazzy:
    name: Jazzy build + test
    runs-on: ubuntu-24.04
    env:
      # keep the launch tests' DDS traffic on this machine
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    steps:
      - uses: actions/checkout@v4

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      # The same pinned archives setup.sh downloads.
      - name: Fetch rpclib and Eigen
        run: |
          wget -q https://github.com/WouterJansen/rpclib/archive/refs/tags/v2.3.1.zip
          mkdir -p external/rpclib
          unzip -q v2.3.1.zip -d external/rpclib
          wget -q -O eigen3.zip https://github.com/WouterJansen/eigen/archive/refs/tags/3.4.1r.zip
          unzip -q eigen3.zip -d temp_eigen
          mkdir -p AirLib/deps/eigen3
          mv temp_eigen/eigen*/Eigen AirLib/deps/eigen3
          rm -rf v2.3.1.zip eigen3.zip temp_eigen

      - name: Install dependencies
        run: |
          rosdep update --rosdistro jazzy
          # rviz2 is only used to visualize, and pulls in a desktop stack
          rosdep install --from-paths ros2/src --ignore-src -y --rosdistro jazzy --skip-keys rviz2

      - name: Build
        shell: bash
        working-directory: ros2
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+ --parallel-workers 2

      - name: Test
        shell: bash
        working-directory: ros2
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select hercules_urdf_import airsim_ros_pkgs \
            --event-handlers console_cohesion+
          colcon test-result --verbose
