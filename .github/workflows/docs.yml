name: Deploy docs

# Builds the MkDocs (Material) documentation site and deploys it to GitHub Pages.
# Requires: repo Settings -> Pages -> Source = "GitHub Actions".
# (On a private repo, GitHub Pages needs a paid plan; the build job still verifies
#  the site compiles regardless.)

# Every push and pull request that touches the docs checks that the site
# builds without warnings (broken links and anchors included); only pushes to
# the published branches deploy it.
on:
  push:
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install -r requirements-docs.txt
      - name: Build site
        run: mkdocs build --strict --clean --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ros2-optim')
    permissions:
      pages: write
      id-token: write
    # Allow one concurrent deployment; don't cancel an in-progress run.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
