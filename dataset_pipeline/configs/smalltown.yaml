# End-to-end dataset generation config for the SmallTown environment.
# Usage: python3 generate_dataset.py configs/smalltown.yaml
#
# Copy this file per sequence and change `sequence` / `trajectory_dir`.
# Relative paths are relative to the HERCULES repository root; ~ and $VARS expand.

environment: smalltown
sequence: smalltown_test2              # dataset folder name under output_root
output_root: ~/hercules_datasets
trajectory_dir: trajectory_data
airsim_settings: ~/Documents/AirSim/settings.json

drones:
  - name: Drone1
    velocity: 0.75                     # m/s, matches run_drones_waypoints.sh
    altitude: -4.0                     # NED z
    use_waypoint_z: false
    no_return_home: false

ugvs:
  - name: Husky1
    speed: 0.29                        # m/s; keep 0.29-0.35 for simpause-stepped physics
    ctrl_hz: 20

ports:
  drone: 41451
  ugv: 41452

collection:
  duration: 1300                       # sim seconds; must cover the full replay
  imu_rate: 200
  odom_hz: 20
  cam_hz: 20
  lidar_hz: 20
  camera: front_center
  stereo_cameras: [stereo_left, stereo_right]
  lidar: LidarSensor1
  save_depth_png: false
  warmup_s: 5                          # wall seconds before launching replay controllers
  post_replay_grace_s: 10              # wall seconds of extra recording after replay ends

calibration:
  enabled: true                        # runs AFTER the main collection
  duration: 300                        # sim seconds budget for the calibration recording
  grace_s: 5

post:
  imu_rates: [200, 500]                # synthetic_imu_<rate>Hz_9axis.txt per vehicle

labels:
  tag: smalltown                       # suffix for ue_actor_label_to_name_<tag>.csv etc.
  dump_timeout_s: 60

paths:
  # cosys_root: HERCULES checkout with PythonClient/ and build_release/ (default: this repository)
  ue_saved_dir: "~/Documents/Unreal Projects/SmallTown/Saved"
