site_name: HERCULES
site_description: 'HERCULES — an open-source Unreal Engine 5 simulation framework for heterogeneous multi-robot SLAM, collaborative perception, and exploration with UAV–UGV teams.'
site_author: 'LunarLab, Georgia Institute of Technology'
site_url: https://lunarlab-gatech.github.io/HERCULES/

repo_url: https://github.com/lunarlab-gatech/HERCULES
repo_name: lunarlab-gatech/HERCULES
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 LunarLab, Georgia Institute of Technology — built on Cosys-AirSim and AirSim (MIT).

theme:
  name: material
  language: en
  logo: media/favicon.svg
  favicon: media/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lunarlab-gatech/HERCULES
    - icon: fontawesome/solid/flask
      link: https://sites.gatech.edu/lunarlab/

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

